[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -v --tb=short
markers =
    auth:         Login, JWT, tokens, registro de firma
    security:     Control de acceso, aislamiento entre firmas, SQL injection, XSS
    cases:        CRUD de casos, estados, filtros, equipo
    tasks:        CRUD de tareas, estados, asignación, cascade
    hours:        Registro de horas, validaciones de tiempo
    billing_calc: Cálculo de facturación flat vs por_horas, redistribución
    processes:    CRUD de procesos, totales calculados, cascade delete
    clients:      CRUD de clientes, estadísticas, tipos
    alerts:       Alertas de vencimiento, resolución
    notifications: Reglas de notificación CRUD
    billing:      Ajustes de facturación, símbolo de moneda
    validation:   Validaciones de entrada (campos requeridos, rangos, formatos)
    soft_delete:  Comportamiento de soft-delete y que recursos eliminados no sean accesibles
    invariant:    Regla de negocio o de seguridad — NUNCA modificar este test para adaptar al código nuevo. Si falla, el código está mal.
    contract:     Contrato de API — solo modificar si hay una migración explícita documentada en INTEGRITY_TRACKER.md
