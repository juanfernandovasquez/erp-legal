services:
  postgres:
    env_file: .env.staging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ErpLegal2024!
      POSTGRES_DB: erp_legal

  backend:
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:ErpLegal2024!@postgres:5432/erp_legal
      DATABASE_URL_SYNC: postgresql://postgres:ErpLegal2024!@postgres:5432/erp_legal
      ENVIRONMENT: staging
      DEBUG: "false"
      SECRET_KEY: c41cdfc2d9b719e5c03c82912e24990adbaf510103acb1c892906387daec5c12
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.staging
    ports:
      - "127.0.0.1:8080:80"
    volumes: []
    command: nginx -g 'daemon off;'
    depends_on:
      - backend

  # Redis no está en uso activo — solo inicia si se pasa --profile cache
  redis:
    profiles:
      - cache
